services:
  staged_db:
    image: mongo:latest
    container_name: ${STAGED_DB_CONTAINER_NAME:-staged_mongo_db}
    ports:
      - "${EXPOSE_MONGO_PORT:-27018}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    # МОНТИРУЕМ ТОМ
    volumes:
      - staged_mongo_data:/data/db
    networks:
      - staged_network

  staged_app:
    build:
      context: ..
      dockerfile: staged/Dockerfile
    container_name: ${STAGED_APP_CONTAINER_NAME:-staged_fastapi_app}
    env_file:
      - .env
    ports:
      - "${EXPOSE_APP_PORT:-8080}:8000"
    depends_on:
      - staged_db
    volumes:
      - staged_app_static:/app/${UPLOAD_DIR}
    networks:
      - staged_network


volumes:
  # mongo volume
  staged_mongo_data:
#  pictures
  staged_app_static:

networks:
  staged_network:
    driver: bridge