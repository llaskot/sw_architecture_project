
services:
  staged_db:
    image: mongo:latest
    container_name: ${STAGED_DB_CONTAINER_NAME:-staged_mongo_db}
    ports:
      - "27018:27017" # Порт базы наружу
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - staged_mongo_data:/data/db
    networks:
      - staged_network
    # Не даем бэкенду стартовать, пока база реально не будет готова
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10

  staged_app:
    build:
      context: ..
      dockerfile: staged/Dockerfile
    container_name: ${STAGED_APP_CONTAINER_NAME:-staged_fastapi_app}
    env_file:
      - .env
    ports:
      - "8080:8000" # Порт бэкенда наружу (для OpenAPI)
    depends_on:
      staged_db:
        condition: service_healthy # Ждем базу
    volumes:
      - staged_app_static:/app/${UPLOAD_DIR}
    networks:
      - staged_network

  frontend-staged:
    build:
      context: ..
      dockerfile: staged/frontend.Dockerfile
      no_cache: true
      args:
        - FRONTEND_GIT_URL=${FRONTEND_GIT_URL}
        - VITE_API_URL=/api # ВАЖНО: заставляем фронт стучаться в /api
    pull_policy: build
    container_name: frontend_staged
    restart: always
    ports:
      - "8050:80" # Порт фронтенда наружу
    volumes:
      # Подключаем конфиг маршрутизации
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    env_file:
      - .env
    depends_on:
      - staged_app
    networks:
      - staged_network

volumes:
  staged_mongo_data:
  staged_app_static:

networks:
  staged_network:
    driver: bridge