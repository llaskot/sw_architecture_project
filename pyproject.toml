[project]
name = "pashnev-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "abstractservice",
    "aiosmtplib>=5.1.0",
    "bcrypt>=5.0.0",
    "cryptography>=46.0.5",
    "faker>=40.11.1",
    "fastapi[standard]>=0.135.1",
    "motor>=3.7.1",
    "pillow>=12.2.0",
    "pip>=26.1.1",
    "pydantic>=2.12.5",
    "pydantic-mongo>=3.1.0",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
asyncio_mode = "auto"
